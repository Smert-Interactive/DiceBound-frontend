name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Node.js project
        id: project
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ ! -f package.json && ! -f package-lock.json ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend is not scaffolded yet; Node.js checks were skipped."
          else
            echo "::error::Commit package.json and package-lock.json together."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.project.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.project.outputs.ready == 'true'
        run: npm run lint

      - name: Test
        if: steps.project.outputs.ready == 'true'
        run: npm run test

      - name: Build
        if: steps.project.outputs.ready == 'true'
        run: npm run build

  publish:
    name: publish-frontend-image
    needs: quality

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/smert-interactive/dicebound-frontend:sha-${{ github.sha }}
